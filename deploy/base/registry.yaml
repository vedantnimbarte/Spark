apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: spark-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: spark-system
spec:
  replicas: 1
  strategy:
    # The PVC is ReadWriteOnce, so the old pod must release it before the new
    # one can mount it.
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          env:
            # Manifest deletion is off by default. Retention prunes old
            # deployment images through the v2 API, which needs this.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: spark-system
spec:
  # NodePort so the kubelet can pull via localhost:30500. Build pods reach the
  # same address by running with hostNetwork, which keeps one image reference
  # valid from both sides.
  type: NodePort
  selector:
    app: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
