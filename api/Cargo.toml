[package]
name = "spark-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum-extra = { version = "0.10", features = ["cookie"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
time = "0.3"
kube = { version = "4.2.0", features = ["client", "runtime"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
async-trait = "0.1.92"
futures = "0.3.34"
tokio-stream = "0.1.19"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
async-stream = "0.3.6"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
hmac = "0.12"

[lints.clippy]
unwrap_used = "warn"
